aid: forged-sports-inc
name: Forged Sports, Inc.
description: Forged Sports, Inc. is a Palo Alto, California software company (founded May 2024) building
  a Venue Management System (VMS) for commercial indoor golf and golf-simulator venues. The platform
  consolidates bay operations, bookings, player profiles, waivers, leagues, business intelligence, and
  third-party integrations into a single command center — offering live bay monitoring, reservation and
  booking management, player-retention analytics, game-popularity insight, and bay-utilization reporting.
  Forged Sports also develops gamified indoor-golf experiences on top of launch-monitor technologies.
  Backed by 500 Global. No public developer API, documentation, or SDK surface is currently published.
